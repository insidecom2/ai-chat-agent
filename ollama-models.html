<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ollama Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; background: #0a0a0f; color: #c0c0c0; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
    .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; height: 100vh; }

    /* ---- views ---- */
    .view { display: none; flex-direction: column; height: 100%; }
    .view.active { display: flex; }

    /* ---- model list ---- */
    .header { padding: 1.5rem 1rem 0.5rem; border-bottom: 1px solid #1a1a2a; }
    .header h1 { font-size: 1.125rem; font-weight: 600; color: #e0e0e0; letter-spacing: 0.05em; }
    .header h1 span { color: #4caf50; }
    .header .sub { color: #666; font-size: 0.75rem; margin-top: 0.25rem; }
    .controls { display: flex; gap: 0.5rem; padding: 0.75rem 1rem; border-bottom: 1px solid #1a1a2a; }
    .controls input { flex: 1; padding: 0.5rem 0.75rem; border-radius: 6px; border: 1px solid #222; background: #111; color: #c0c0c0; font-size: 0.8125rem; font-family: inherit; outline: none; }
    .controls input:focus { border-color: #4caf50; }
    .controls button { padding: 0.5rem 1rem; border-radius: 6px; border: none; background: #1a3a1a; color: #4caf50; font-size: 0.8125rem; font-family: inherit; cursor: pointer; }
    .controls button:hover { background: #1f4a1f; }
    .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
    .scroll { flex: 1; overflow-y: auto; padding: 0.75rem 1rem; }
    .scroll::-webkit-scrollbar { width: 6px; }
    .scroll::-webkit-scrollbar-track { background: transparent; }
    .scroll::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }
    .model { background: #111; border: 1px solid #1a1a2a; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.5rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: border-color 0.15s; }
    .model:hover { border-color: #4caf5066; }
    .model-name { font-weight: 500; color: #e0e0e0; font-size: 0.875rem; }

    .model-detail { font-size: 0.6875rem; color: #555; margin-top: 0.125rem; }
    .model-size { font-size: 0.75rem; color: #666; }
    .badge { display: inline-block; font-size: 0.625rem; background: #1a1a2a; color: #888; padding: 0.125rem 0.4rem; border-radius: 3px; margin-left: 0.375rem; }
    .empty { text-align: center; padding: 3rem 0; color: #444; font-size: 0.875rem; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #222; border-top-color: #4caf50; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; padding: 3rem 0; color: #555; font-size: 0.8125rem; }
    .error { background: #1a0a0a; border: 1px solid #4a1a1a; color: #e66; padding: 0.625rem 0.875rem; border-radius: 6px; font-size: 0.8125rem; margin-bottom: 0.5rem; }

    /* ---- chat view ---- */
    .topbar { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-bottom: 1px solid #1a1a2a; background: #0d0d15; }
    .topbar .back { background: none; border: none; color: #666; font-size: 1.25rem; cursor: pointer; padding: 0.25rem; line-height: 1; font-family: inherit; }
    .topbar .back:hover { color: #4caf50; }
    .topbar .title { font-size: 0.8125rem; color: #e0e0e0; font-weight: 500; flex: 1; }
    .topbar .title small { color: #555; font-weight: 400; }
    #newChatBtn { padding: 0.375rem 0.75rem; border-radius: 6px; border: 1px solid #2a2a2a; background: transparent; color: #888; font-size: 0.75rem; font-family: inherit; cursor: pointer; white-space: nowrap; }
    #newChatBtn:hover { border-color: #4caf5066; color: #4caf50; }
    .messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }
    .msg { max-width: 85%; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user { align-self: flex-end; }
    .msg.assistant { align-self: flex-start; }
    .msg .bubble { padding: 0.625rem 1rem; border-radius: 12px; font-size: 0.875rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .msg.user .bubble { background: #1a3a1a; color: #c0e0c0; border-bottom-right-radius: 4px; }
    .msg.assistant .bubble { background: #151520; color: #c0c0d0; border: 1px solid #222; border-bottom-left-radius: 4px; }
    .msg .label { font-size: 0.6875rem; color: #555; margin-bottom: 0.25rem; padding: 0 0.25rem; }
    .chat-input-area { display: flex; gap: 0.5rem; padding: 0.75rem 1rem; border-top: 1px solid #1a1a2a; background: #0d0d15; }
    .input-wrap { flex: 1; position: relative; }
    .chat-input-area textarea { width: 100%; padding: 0.625rem 0.875rem; border-radius: 8px; border: 1px solid #222; background: #111; color: #c0c0c0; font-size: 0.875rem; font-family: inherit; outline: none; resize: none; min-height: 44px; max-height: 120px; line-height: 1.5; }
    .chat-input-area textarea:focus { border-color: #4caf50; }
    .chat-input-area button { padding: 0.5rem 1rem; border-radius: 8px; border: none; background: #1a3a1a; color: #4caf50; font-size: 0.875rem; font-family: inherit; cursor: pointer; align-self: flex-end; height: 44px; }
    .chat-input-area button:hover { background: #1f4a1f; }
    .chat-input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
    .cursor { display: inline-block; width: 8px; height: 1.1em; background: #4caf50; margin-left: 2px; animation: blink 1s steps(2) infinite; vertical-align: text-bottom; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    .typing-indicator { align-self: flex-start; display: flex; gap: 4px; padding: 0.75rem 1rem; }
    .typing-indicator span { width: 8px; height: 8px; background: #4caf50; border-radius: 50%; animation: dotPulse 1.4s ease-in-out infinite; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }

    .cmd-suggestions {
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      margin-bottom: 4px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      z-index: 20;
    }
    .cmd-suggestions .cmd-item {
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8125rem;
    }
    .cmd-suggestions .cmd-item:hover,
    .cmd-suggestions .cmd-item.sel {
      background: #1a2a1a;
    }
    .cmd-suggestions .cmd-key { color: #4caf50; font-weight: 500; }
    .cmd-suggestions .cmd-desc { color: #666; font-size: 0.75rem; }

    @media (max-width: 600px) {
      .msg { max-width: 92%; }
      .msg .bubble { font-size: 0.8125rem; padding: 0.5rem 0.75rem; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- ===== Model List View ===== -->
    <div id="listView" class="view active">
      <div class="header">
        <h1><span>⧩</span> Ollama Chat</h1>
        <div class="sub">Select a model to start chatting</div>
      </div>
      <div class="controls">
        <input id="host" type="text" value="http://localhost:11434" placeholder="http://localhost:11434" />
        <button id="fetchBtn">Refresh</button>
      </div>
      <div id="modelList" class="scroll"></div>
    </div>

    <!-- ===== Chat View ===== -->
    <div id="chatView" class="view">
      <div class="topbar">
        <button class="back" id="backBtn">←</button>
        <div class="title">
          <span id="chatModelName"></span>
          <small id="chatModelBadge"></small>
        </div>
        <button id="newChatBtn">+ New Chat</button>
      </div>
      <div id="messages" class="messages"></div>
      <div class="chat-input-area">
        <div class="input-wrap">
          <div id="cmdSuggestions" class="cmd-suggestions" style="display:none"></div>
          <textarea id="chatInput" rows="1" placeholder="Type a message…" disabled></textarea>
        </div>
        <button id="sendBtn" disabled>Send</button>
      </div>
    </div>

  </div>

  <script>
    /* ─── state ─── */
    const hostInput = document.getElementById('host');
    const fetchBtn = document.getElementById('fetchBtn');
    const modelList = document.getElementById('modelList');
    const listView = document.getElementById('listView');
    const chatView = document.getElementById('chatView');
    const backBtn = document.getElementById('backBtn');
    const chatModelName = document.getElementById('chatModelName');
    const chatModelBadge = document.getElementById('chatModelBadge');
    const messages = document.getElementById('messages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    const COMMANDS = [
      { key: '/gen-image', desc: 'Generate image from last Ollama response' },
    ];
    let cmdFiltered = [];
    let cmdIdx = -1;

    let currentHost = 'http://localhost:11434';
    let selectedModel = null;
    let history = [];
    let streamSpan = null;

    /* ─── helpers ─── */
    function baseUrl() { return currentHost.replace(/\/+$/, ''); }

    function formatBytes(b) {
      if (b === 0) return '0 B';
      const u = ['B','KB','MB','GB','TB'];
      const i = Math.floor(Math.log(b) / Math.log(1024));
      return (b / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + u[i];
    }

    function formatDate(ts) { return ts ? new Date(ts).toLocaleString() : '—'; }

    function scrollToBottom(el) { requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; }); }

    /* ─── views ─── */
    function showList() {
      listView.classList.add('active');
      chatView.classList.remove('active');
    }

    function showChat() {
      listView.classList.remove('active');
      chatView.classList.add('active');
      chatInput.focus();
    }

    /* ─── model list ─── */
    async function fetchModels() {
      const host = hostInput.value.trim() || 'http://localhost:11434';
      currentHost = host;
      const res = await fetch(`${baseUrl()}/api/tags`);
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      return (await res.json()).models;
    }

    function renderModels(models) {
      if (!models || models.length === 0) {
        modelList.innerHTML = '<div class="empty">No models found. Pull one with <code>ollama pull &lt;name&gt;</code></div>';
        return;
      }
      modelList.innerHTML = models.map(m => `
        <div class="model" data-model="${m.name}">
          <div>
            <div class="model-name">${m.name}<span class="badge">${m.details?.parameter_size || '—'}</span></div>
            <div class="model-detail">Modified: ${formatDate(m.modified_at)}</div>
          </div>
          <div class="model-size">${formatBytes(m.size)}</div>
        </div>
      `).join('');

      modelList.querySelectorAll('.model').forEach(el => {
        el.addEventListener('click', () => startChat(el.dataset.model));
      });
    }

    function showModelError(msg) {
      modelList.innerHTML = `<div class="error">${msg}</div>`;
    }

    function showModelLoading() {
      modelList.innerHTML = `<div class="loading"><div class="spinner"></div><span>Fetching models…</span></div>`;
    }

    async function loadModels() {
      fetchBtn.disabled = true;
      showModelLoading();
      try {
        const models = await fetchModels();
        renderModels(models);
      } catch (err) {
        showModelError(`Connection failed: ${err.message}. Make sure Ollama is running.`);
      } finally {
        fetchBtn.disabled = false;
      }
    }

    /* ─── chat ─── */
    function startChat(modelName) {
      selectedModel = modelName;
      history = [];
      chatModelName.textContent = modelName;
      chatModelBadge.textContent = '';
      messages.innerHTML = '';
      chatInput.disabled = false;
      sendBtn.disabled = false;
      showChat();
      addMessage('assistant', `Chatting with **${modelName}**. Say anything!`);
    }

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerHTML = `<div class="label">${role === 'user' ? 'You' : selectedModel}</div><div class="bubble">${content}</div>`;
      messages.appendChild(div);
      scrollToBottom(messages);
      return div;
    }

    function addStreamingBubble() {
      const span = document.createElement('span');
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.appendChild(span);
      bubble.appendChild(cursor);
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = selectedModel;
      const div = document.createElement('div');
      div.className = 'msg assistant';
      div.appendChild(label);
      div.appendChild(bubble);
      messages.appendChild(div);
      streamSpan = span;
      scrollToBottom(messages);
    }

    function updateStreamText(text) {
      if (streamSpan) streamSpan.textContent = text;
      scrollToBottom(messages);
    }

    function removeCursor() {
      const el = document.querySelector('.cursor');
      if (el) el.remove();
    }

    function addImageMessage(url, prompt) {
      const div = document.createElement('div');
      div.className = 'msg assistant';
      div.innerHTML = `<div class="label">${selectedModel}</div><div class="bubble"><img src="${url}" alt="${prompt}" style="max-width:100%;border-radius:8px;margin-bottom:0.25rem"/><div style="font-size:0.6875rem;color:#555">${prompt}</div></div>`;
      messages.appendChild(div);
      scrollToBottom(messages);
    }

    const cmdSuggestions = document.getElementById('cmdSuggestions');

    function renderCommands() {
      if (cmdFiltered.length === 0) { cmdSuggestions.style.display = 'none'; return; }
      cmdSuggestions.style.display = 'block';
      cmdIdx = Math.min(cmdIdx, cmdFiltered.length - 1);
      cmdSuggestions.innerHTML = cmdFiltered.map((c, i) =>
        `<div class="cmd-item${i === cmdIdx ? ' sel' : ''}" data-idx="${i}">
          <span class="cmd-key">${c.key}</span>
          <span class="cmd-desc">${c.desc}</span>
        </div>`
      ).join('');
      cmdSuggestions.querySelectorAll('.cmd-item').forEach(el => {
        el.addEventListener('click', () => selectCommand(parseInt(el.dataset.idx)));
        el.addEventListener('mouseenter', () => { cmdIdx = parseInt(el.dataset.idx); renderCommands(); });
      });
    }

    function hideCommands() { cmdSuggestions.style.display = 'none'; cmdFiltered = []; cmdIdx = -1; }

    function selectCommand(idx) {
      if (idx < 0 || idx >= cmdFiltered.length) return;
      chatInput.value = cmdFiltered[idx].key + ' ';
      chatInput.selectionStart = chatInput.selectionEnd = chatInput.value.length;
      hideCommands();
      chatInput.focus();
    }

    function updateCommands(text) {
      if (text.startsWith('/')) {
        cmdFiltered = COMMANDS.filter(c => c.key.startsWith(text));
        cmdIdx = cmdFiltered.length > 0 ? 0 : -1;
        renderCommands();
      } else {
        hideCommands();
      }
    }

    function getLastPrompt() {
      for (let i = history.length - 2; i >= 0; i--) {
        const c = history[i].content;
        if (!c.startsWith('/gen-image')) return c;
      }
      return null;
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = '';
      chatInput.style.height = 'auto';
      chatInput.disabled = true;
      sendBtn.disabled = true;

      addMessage('user', text);
      history.push({ role: 'user', content: text });

      if (text.startsWith('/gen-image')) {
        const custom = text.slice('/gen-image'.length).trim();
        const prompt = custom || getLastPrompt();
        if (prompt) {
          const cleaned = (() => {
            if (prompt.includes('/imagine')) return prompt.slice(prompt.indexOf('/imagine') + '/imagine'.length).trim();
            const q1 = prompt.indexOf('"');
            if (q1 !== -1) {
              const q2 = prompt.indexOf('"', q1 + 1);
              if (q2 !== -1) return prompt.slice(q1 + 1, q2);
            }
            return prompt;
          })();
          const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(cleaned)}`;
          addImageMessage(imgUrl, cleaned);
        } else {
          addMessage('assistant', 'No prompt available. Ask Ollama for a description first, then use /gen-image.');
        }
        chatInput.disabled = false;
        sendBtn.disabled = false;
        chatInput.focus();
        return;
      }

      const body = {
        model: selectedModel,
        messages: history,
        stream: true,
      };

      addStreamingBubble();
      let fullReply = '';

      try {
        const res = await fetch(`${baseUrl()}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`HTTP ${res.status}: ${errText}`);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const chunk = JSON.parse(line);
              if (chunk.message?.content) {
                fullReply += chunk.message.content;
                updateStreamText(fullReply);
              }
              if (chunk.done) break;
            } catch { /* skip partial lines */ }
          }
        }
        removeCursor();
        streamSpan = null;
        history.push({ role: 'assistant', content: fullReply });
      } catch (err) {
        removeCursor();
        if (streamSpan) streamSpan.textContent = '';
        streamSpan = null;
        addMessage('assistant', `Error: ${err.message}`);
      } finally {
        chatInput.disabled = false;
        sendBtn.disabled = false;
        chatInput.focus();
      }
    }

    /* ─── events ─── */
    fetchBtn.addEventListener('click', loadModels);
    hostInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadModels(); });

    const goToList = () => { selectedModel = null; history = []; streamSpan = null; showList(); };
    backBtn.addEventListener('click', goToList);
    document.getElementById('newChatBtn').addEventListener('click', goToList);

    chatInput.addEventListener('keydown', e => {
      if (cmdSuggestions.style.display === 'block') {
        if (e.key === 'ArrowDown') { e.preventDefault(); cmdIdx = Math.min(cmdIdx + 1, cmdFiltered.length - 1); renderCommands(); return; }
        if (e.key === 'ArrowUp') { e.preventDefault(); cmdIdx = Math.max(cmdIdx - 1, 0); renderCommands(); return; }
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); selectCommand(cmdIdx); return; }
        if (e.key === 'Escape') { hideCommands(); return; }
      }
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    sendBtn.addEventListener('click', sendMessage);

    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
      updateCommands(chatInput.value);
    });

    document.addEventListener('click', e => { if (!e.target.closest('.input-wrap')) hideCommands(); });

    /* ─── boot ─── */
    loadModels();
  </script>
</body>
</html>
